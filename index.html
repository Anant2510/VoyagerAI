/* ═══ ARCHITECTURE DIAGRAM (SVG) ══════════════════════════════ */
function ArchitectureDiagram({activeStage,onStageClick}){
  const W=1000,H=270,nodeW=108,nodeH=76,gap=8;
  const totalW=PIPELINE.length*nodeW+(PIPELINE.length-1)*gap;
  const startX=(W-totalW)/2;
  const y=60;

  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
      {/* Connecting lines */}
      {PIPELINE.map((p,i)=>{
        if(i===PIPELINE.length-1) return null;
        const x1=startX+i*(nodeW+gap)+nodeW;
        const x2=startX+(i+1)*(nodeW+gap);
        const cy=y+nodeH/2;
        return <g key={`line-${i}`}>
          <line x1={x1} y1={cy} x2={x2} y2={cy} stroke={X.bdr} strokeWidth="2" strokeDasharray="6 4">
            <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2s" repeatCount="indefinite"/>
          </line>
          <polygon points={`${x2-6},${cy-4} ${x2},${cy} ${x2-6},${cy+4}`} fill={X.t3}/>
        </g>;
      })}

      {/* Nodes */}
      {PIPELINE.map((p,i)=>{
        const x=startX+i*(nodeW+gap);
        const active=activeStage===p.id;
        return <g key={p.id} onClick={()=>onStageClick(p.id)} style={{cursor:"pointer"}}>
          <rect x={x} y={y} width={nodeW} height={nodeH} rx="12" ry="12"
            fill={active?p.bg:X.card}
            stroke={active?p.color:X.bdr}
            strokeWidth={active?2:1}
            style={{filter:active?`drop-shadow(0 0 8px ${p.color}30)`:"none",transition:"all .2s"}}/>
          <text x={x+nodeW/2} y={y+24} textAnchor="middle" fontSize="16">{p.icon}</text>
          {p.label.split("\n").map((line,li)=>(
            <text key={li} x={x+nodeW/2} y={y+40+li*12} textAnchor="middle"
              fontSize="7.5" fontWeight="700" fill={active?p.color:X.t2}
              fontFamily="Inter,sans-serif">{line}</text>
          ))}
        </g>;
      })}

      {/* Top label */}
      <text x={W/2} y={28} textAnchor="middle" fontSize="11" fontWeight="800" fill={X.t1} fontFamily="Inter,sans-serif" letterSpacing=".06em">
        VoyagerAI PIPELINE — 8 AUTONOMOUS AGENTS
      </text>

      {/* Bottom: Differentiators row */}
      {PIPELINE.map((p,i)=>{
        const x=startX+i*(nodeW+gap);
        const active=activeStage===p.id;
        return <g key={`diff-${i}`}>
          <line x1={x+nodeW/2} y1={y+nodeH} x2={x+nodeW/2} y2={y+nodeH+18} stroke={active?p.color:X.bdr} strokeWidth="1" strokeDasharray={active?"":"3 3"}/>
          <text x={x+nodeW/2} y={y+nodeH+30} textAnchor="middle" fontSize="6" fontWeight="600"
            fill={active?p.color:X.t3} fontFamily="Inter,sans-serif">
            {p.kpi}
          </text>
        </g>;
      })}

      {/* Activation channels bar */}
      <rect x={startX-10} y={H-34} width={totalW+20} height={26} rx="8" fill={X.surf} stroke={X.bdr} strokeWidth="1"/>
      <text x={startX} y={H-17} fontSize="7.5" fontWeight="700" fill={X.t3} fontFamily="Inter,sans-serif" letterSpacing=".05em">ACTIVATION:</text>
      {CHANNELS.map((ch,i)=>(
        <text key={ch} x={startX+80+i*115} y={H-17} fontSize="7.5" fontWeight="600" fill={X.t2} fontFamily="Inter,sans-serif">{ch}</text>
      ))}
    </svg>
  );
}

/* ═══ AGENT ROW (in demo) ═════════════════════════════════════ */
function AgentRow({step,pipeline,index,state}){
  const p=pipeline;
  const running=state==="running",done=state==="done",pending=!running&&!done;
  const statusLabel=running?"RUNNING":done?"DONE":"QUEUED";
  const statusColor=running?X.amber:done?X.green:X.t3;
  return(
    <div style={{display:"flex",gap:11,padding:"14px 0",borderBottom:`1px solid ${X.bdrL}`,opacity:pending?.4:1,transition:"opacity .4s"}}>
      {/* Icon + step number */}
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5,flexShrink:0,width:40}}>
        <div style={{width:38,height:38,borderRadius:11,
          background:done?p.bg:running?X.amberB:X.surf,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,
          border:running?`2px solid ${X.amber}`:`1.5px solid ${done?p.color:X.bdr}`,
          animation:running?"pulse 1.5s infinite":"none"}}>
          {running?<span style={{animation:"spin 1s linear infinite",display:"inline-block"}}>⚙️</span>:p.icon}
        </div>
        <div style={{fontSize:8.5,fontWeight:800,color:done?p.color:X.t3,fontFamily:mono}}>{index+1}/8</div>
      </div>

      {/* Body */}
      <div style={{flex:1,minWidth:0}}>
        {/* Agent identity header */}
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:(running||done)?8:0,flexWrap:"wrap"}}>
          <span style={{fontWeight:800,fontSize:12.5,color:done?p.color:X.t1}}>{p.agent}</span>
          <span style={{fontSize:8.5,fontWeight:700,padding:"2px 7px",borderRadius:5,background:p.bg,color:p.color}}>{p.diff}</span>
          <span style={{marginLeft:"auto",fontSize:9,fontWeight:800,color:statusColor,fontFamily:mono,letterSpacing:".04em"}}>{running?"● ":done?"✓ ":"· "}{statusLabel}</span>
        </div>

        {/* Data utilized + action taken — shown once the agent starts working */}
        {(running||done)&&(
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
              <span style={{fontSize:7.5,fontWeight:800,color:X.t2,background:X.surf,border:`1px solid ${X.bdr}`,padding:"3px 6px",borderRadius:5,letterSpacing:".05em",flexShrink:0,marginTop:1,width:84,textAlign:"center"}}>DATA USED</span>
              <span style={{fontSize:11,color:X.t2,lineHeight:1.5}}>{step.uses}</span>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
              <span style={{fontSize:7.5,fontWeight:800,color:p.color,background:p.bg,border:`1px solid ${p.color}30`,padding:"3px 6px",borderRadius:5,letterSpacing:".05em",flexShrink:0,marginTop:1,width:84,textAlign:"center"}}>ACTION</span>
              <span style={{fontSize:11,color:X.t1,fontWeight:600,lineHeight:1.5}}>{step.action}</span>
            </div>
            {done&&(
              <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                <span style={{fontSize:7.5,fontWeight:800,color:X.t3,background:X.card,border:`1px solid ${X.bdr}`,padding:"3px 6px",borderRadius:5,letterSpacing:".05em",flexShrink:0,marginTop:1,width:84,textAlign:"center"}}>OUTPUT</span>
                <div style={{flex:1,minWidth:0}}><DataBlock entries={step.d} color={p.color}/></div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══ MAIN APP ════════════════════════════════════════════════ */
function App(){
  const [activeStage,setActiveStage]=useState(null);
  const [selectedUC,setSelectedUC]=useState(null);
  const [phase,setPhase]=useState("idle");
  const [stepStates,setStepStates]=useState([]);
  const [currentStep,setCurrentStep]=useState(-1);
  const [elapsed,setElapsed]=useState(0);
  const [claimed,setClaimed]=useState(false);
  const [demoTab,setDemoTab]=useState("agents");
  const timer=useRef(null);
  const demoRef=useRef(null);

  const uc=selectedUC?USE_CASES.find(u=>u.id===selectedUC):null;

  const runDemo=useCallback(async(ucId)=>{
    const u=USE_CASES.find(c=>c.id===ucId);
    setSelectedUC(ucId);
    setPhase("running");setClaimed(false);setDemoTab("agents");
    const states=u.steps.map(()=>"pending");
    setStepStates(states);setCurrentStep(-1);setElapsed(0);
    setTimeout(()=>demoRef.current?.scrollIntoView({behavior:"smooth",block:"start"}),100);
    const t0=Date.now();
    timer.current=setInterval(()=>setElapsed(Date.now()-t0),60);
    for(let i=0;i<u.steps.length;i++){
      setCurrentStep(i);
      setStepStates(s=>s.map((v,j)=>j===i?"running":v));
      await new Promise(r=>setTimeout(r,800+Math.random()*500));
      setStepStates(s=>s.map((v,j)=>j===i?"done":v));
    }
    clearInterval(timer.current);
    setElapsed(Date.now()-t0);
    setPhase("done");setDemoTab("experience");
  },[]);

  const resetDemo=()=>{
    clearInterval(timer.current);
    setPhase("idle");setSelectedUC(null);setStepStates([]);setCurrentStep(-1);setElapsed(0);setClaimed(false);setDemoTab("agents");
  };

  useEffect(()=>()=>clearInterval(timer.current),[]);
  const done=stepStates.filter(s=>s==="done").length;
  const total=uc?uc.steps.length:8;

  return(
    <div style={{minHeight:"100vh",background:X.bg}}>


        {/* ═══ HEADER ═══════════════════════════════════ */}
        <header style={{background:"#ffffff",borderBottom:`1px solid ${X.bdr}`,padding:"0 32px",height:56,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>

                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
                {[["Email","#eff6ff","#2563eb"],["App","#f0fdf4","#16a34a"],["Lounge","#fff4f1","#F15B40"]].map(([label,bg,col])=><div key={label} style={{background:bg,border:`1px solid ${col}22`,borderRadius:6,padding:"7px 6px",textAlign:"center"}}><div style={{fontSize:8,fontWeight:700,color:col,textTransform:"uppercase"}}>{label}</div><div style={{fontSize:9,color:"#475569",marginTop:2}}>Ready</div></div>)}
              </div>
            </div>
          </div>
        </section>

        {/* ═══ KPI STRIP ════════════════════════════════ */}
        <section style={{margin:"16px 24px 0",display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:10}}>
          {KPIS.map((k,i)=>(
            <div key={i} className="fu hover-lift" style={{animationDelay:`${i*.06}s`,background:X.card,borderRadius:14,padding:"16px 14px",border:`1px solid ${X.bdr}`,boxShadow:X.sh,textAlign:"center"}}>
              <div style={{fontWeight:900,fontSize:22,color:k.color,fontFamily:mono}}>{k.stat}</div>
              <div style={{fontSize:10,color:X.t2,marginTop:4,lineHeight:1.35}}>{k.label}</div>
            </div>
          ))}
        </section>

        {/* ═══ ARCHITECTURE SECTION ═════════════════════ */}
        <section id="architecture" className="fu" style={{margin:"24px 24px 0",background:X.card,borderRadius:18,border:`1px solid ${X.bdr}`,boxShadow:X.sh,padding:"28px 32px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <div>
              <div style={{fontWeight:800,fontSize:18,color:X.t1,marginBottom:4}}>Architecture — How Agents Connect</div>
              <div style={{fontSize:13,color:X.t3}}>Click any stage to explore what each agent does</div>
            </div>
            {activeStage&&<button onClick={()=>setActiveStage(null)} style={{padding:"6px 14px",borderRadius:8,border:`1px solid ${X.bdr}`,background:X.card,color:X.t2,fontSize:11,fontWeight:600}}>Clear selection</button>}
          </div>

          <ArchitectureDiagram activeStage={activeStage} onStageClick={id=>setActiveStage(id===activeStage?null:id)}/>

          {/* Detail panel when stage clicked */}
          {activeStage&&(()=>{
            const p=PIPELINE.find(s=>s.id===activeStage);
            return(
              <div className="fu" style={{marginTop:16,padding:20,background:p.bg,borderRadius:14,border:`1px solid ${p.color}25`,display:"flex",gap:20,alignItems:"flex-start"}}>
                <div style={{width:52,height:52,borderRadius:14,background:X.card,border:`1px solid ${p.color}30`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,flexShrink:0}}>{p.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:15,color:X.t1,marginBottom:4}}>{p.agent}</div>
                  <div style={{fontSize:13,color:X.t2,lineHeight:1.65,marginBottom:10}}>{p.desc}</div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    <Badge text={`Differentiator: ${p.diff}`} color={p.color} bg={`${p.color}15`}/>
                    <Badge text={`KPI: ${p.kpi}`} color={X.green} bg={X.greenB}/>
                  </div>
                </div>
              </div>
            );
          })()}
        </section>

        {/* ═══ USE CASE SELECTOR ═══════════════════════ */}
        <section id="demo" ref={demoRef} style={{margin:"24px 24px 0"}}>
          <div style={{marginBottom:16}}>
            <div style={{fontWeight:800,fontSize:18,color:X.t1,marginBottom:4}}>Live Agent Orchestration Demo</div>
            <div style={{fontSize:13,color:X.t3}}>Select a use case to launch the VoyagerAI pipeline and watch all 8 agents execute in real time</div>
          </div>

          {phase==="idle"?(
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16}}>
              {USE_CASES.map(u=>(
                <div key={u.id} className="hover-lift" onClick={()=>runDemo(u.id)} style={{
                  background:X.card,borderRadius:16,padding:24,border:`1px solid ${X.bdr}`,boxShadow:X.sh,cursor:"pointer",
                }}>
                  <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
                    <div style={{width:48,height:48,borderRadius:14,background:u.bg,border:`1px solid ${u.color}25`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>{u.icon}</div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:800,fontSize:16,color:X.t1}}>{u.title}</div>
                      <div style={{fontSize:12,color:X.t3,marginTop:2}}>{u.subtitle}</div>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
                    <Badge text={u.passenger.tier} color={u.color} bg={u.bg}/>
                    <Badge text={`Hub: ${u.passenger.hub}`} color={X.t2}/>
                    <Badge text={`LTV: ${u.passenger.ltv}`} color={X.green} bg={X.greenB}/>
                  </div>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"11px 20px",borderRadius:10,border:"none",background:"#D4552F",fontWeight:700,fontSize:13,color:"#fff",transition:"background .2s"}} onMouseEnter={e=>e.currentTarget.style.background="#B94728"} onMouseLeave={e=>e.currentTarget.style.background="#D4552F"}>Launch Demo →</div>
                </div>
              ))}
            </div>
          ):(
            /* ═══ LIVE DEMO RUNNING ═══════════════════ */
            <div>
              {/* Demo header bar */}
              <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:16,background:X.card,borderRadius:14,padding:"12px 18px",border:`1px solid ${X.bdr}`,boxShadow:X.sh}}>
                <div style={{width:40,height:40,borderRadius:12,background:uc.bg,border:`1px solid ${uc.color}25`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>{uc.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:15,color:X.t1}}>{uc.title}</div>
                  <div style={{fontSize:11,color:X.t3}}>{uc.subtitle}</div>
                </div>
                <div style={{fontSize:11,fontFamily:mono,color:X.t2,padding:"4px 12px",background:X.surf,borderRadius:8,border:`1px solid ${X.bdr}`}}>
                  {done}/{total}&ensp;·&ensp;<span style={{color:phase==="done"?X.green:X.amber,fontWeight:600}}>{elapsed}ms</span>
                </div>
                <button onClick={resetDemo} style={{padding:"7px 16px",borderRadius:8,border:`1px solid ${X.bdr}`,background:X.card,color:X.t2,fontSize:12,fontWeight:600}}>← Back to Use Cases</button>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr)",gap:16}}>

                {/* LEFT: Alert + Profile + Agent Log */}
                <div>
                  {/* Trigger alert */}
                  <div className="fu" style={{background:X.card,border:`1px solid ${X.bdr}`,borderRadius:16,padding:18,marginBottom:14,boxShadow:X.sh,borderLeft:`4px solid ${uc.color}`}}>
                    <div style={{fontWeight:800,fontSize:14,color:uc.color,marginBottom:8}}>{uc.trigger.title}</div>
                    <div style={{display:"flex",flexDirection:"column",gap:5}}>
                      {uc.trigger.signals.map((s,i)=>(
                        <div key={i} className="si" style={{animationDelay:`${i*.06}s`,display:"flex",alignItems:"center",gap:8,background:X.surf,borderRadius:9,padding:"7px 11px",border:`1px solid ${X.bdr}`}}>
                          <Badge text={s.sev.toUpperCase()} color={s.sev==="critical"?X.red:s.sev==="high"?X.amber:X.t3} bg={s.sev==="critical"?X.redB:s.sev==="high"?X.amberB:X.surf}/>
                          <span style={{fontSize:11,color:X.t2,flex:1}}>{s.e}</span>
                          <span style={{fontSize:9,fontFamily:mono,color:X.t3}}>{s.s}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Profile */}
                  <div className="fu" style={{animationDelay:".05s",background:X.card,border:`1px solid ${X.bdr}`,borderRadius:16,padding:16,marginBottom:14,boxShadow:X.sh}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                      <div style={{width:40,height:40,borderRadius:"50%",background:X.coralL,border:`2px solid ${X.coralB}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>👤</div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:700,fontSize:14,color:X.t1}}>{uc.passenger.name}</div>
                        <div style={{fontSize:11,color:X.t3}}>{uc.passenger.tier} · {uc.passenger.hub}</div>
                      </div>
                      <Badge text={`Churn: ${uc.passenger.churnRisk}%`} color={X.red} bg={X.redB}/>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
                      {[["LTV",uc.passenger.ltv],["Flights YTD",uc.passenger.flightsYTD],["Miles",uc.passenger.miles.toLocaleString()],["Disruptions",uc.passenger.disruptions],["Hub",uc.passenger.hub],["Competitor",uc.passenger.competitor]].map(([k,v])=>(
                        <div key={k} style={{background:X.surf,borderRadius:8,padding:"6px 10px",border:`1px solid ${X.bdrL}`}}>
                          <div style={{fontSize:8,color:X.t3,textTransform:"uppercase",fontWeight:700,letterSpacing:".06em"}}>{k}</div>
                          <div style={{fontSize:11,fontWeight:600,color:X.t1,marginTop:1}}>{v}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Agent execution log */}
                  <div className="fu" style={{animationDelay:".1s",background:X.card,border:`1px solid ${X.bdr}`,borderRadius:16,padding:18,boxShadow:X.sh}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
                      <div style={{fontWeight:800,fontSize:13,color:X.t1}}>Agent Pipeline Execution</div>
                      <div style={{fontSize:10,fontFamily:mono,color:X.t3}}>{phase==="running"?`Step ${currentStep+1} of ${total}`:`Done · ${elapsed}ms`}</div>
                    </div>
                    <div style={{fontSize:10,color:X.t3,marginBottom:10,lineHeight:1.4}}>Each of the 8 agents runs in order — showing the <strong style={{color:X.t2}}>data it used</strong> and the <strong style={{color:X.t2}}>action it took</strong>.</div>
                    <div style={{height:5,background:X.surf,borderRadius:3,marginBottom:14,overflow:"hidden",border:`1px solid ${X.bdr}`}}>
                      <div style={{height:"100%",width:`${(done/total)*100}%`,background:`linear-gradient(90deg,${X.coral},${X.green})`,borderRadius:3,transition:"width .4s"}}/>
                    </div>
                    {uc.steps.map((step,i)=><AgentRow key={i} step={step} pipeline={PIPELINE[i]} index={i} state={stepStates[i]||"pending"}/>)}
                  </div>
                </div>

                {/* RIGHT: Tabs */}
                <div>
                  <div style={{display:"flex",gap:4,marginBottom:14,background:X.surf,borderRadius:12,padding:4,border:`1px solid ${X.bdr}`}}>
                    {[{k:"agents",l:"🤖 Agent Flow"},{k:"experience",l:"📱 Experience"},{k:"data",l:"📊 Data"}].map(t=>(
                      <button key={t.k} onClick={()=>setDemoTab(t.k)} style={{flex:1,padding:"9px 10px",borderRadius:9,border:"none",fontSize:11,fontWeight:700,background:demoTab===t.k?X.card:"transparent",color:demoTab===t.k?X.t1:X.t3,boxShadow:demoTab===t.k?X.sh:"none"}}>{t.l}</button>
                    ))}
                  </div>

                  {/* Agent Flow tab */}
                  {demoTab==="agents"&&(
                    <div style={{background:X.card,border:`1px solid ${X.bdr}`,borderRadius:16,padding:20,boxShadow:X.sh}}>
                      <div style={{fontWeight:800,fontSize:14,marginBottom:18,color:X.t1}}>Agent ↔ Pipeline Map</div>
                      {PIPELINE.map((p,i)=>(
                        <div key={p.id} style={{display:"flex",gap:12,marginBottom:i<7?16:0,opacity:(stepStates[i]||"pending")==="pending"?.15:1,transition:"opacity .4s"}}>
                          <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                            <div style={{width:32,height:32,borderRadius:10,flexShrink:0,background:(stepStates[i]||"pending")==="done"?p.bg:X.surf,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,border:`1.5px solid ${(stepStates[i]||"pending")==="done"?p.color:X.bdr}`}}>{p.icon}</div>
                            {i<7&&<div style={{width:2,flex:1,marginTop:4,borderRadius:1,background:(stepStates[i]||"pending")==="done"?`${p.color}30`:X.bdr}}/>}
                          </div>
                          <div style={{flex:1}}>
                            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3,flexWrap:"wrap"}}>
                              <span style={{fontWeight:700,fontSize:12,color:X.t1}}>{p.agent}</span>
                              <span style={{fontSize:8.5,fontWeight:700,padding:"2px 7px",borderRadius:5,background:p.bg,color:p.color}}>{p.diff}</span>
                            </div>
                            <div style={{fontSize:11,color:X.t3}}>{uc.steps[i]?.t||""}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Experience tab */}
                  {demoTab==="experience"&&(
                    <div>
                      {phase==="running"?(
                        <div style={{background:X.card,border:`1px solid ${X.bdr}`,borderRadius:16,padding:48,textAlign:"center",boxShadow:X.sh}}>
                          <div style={{fontSize:36,marginBottom:14,animation:"spin 2s linear infinite",display:"inline-block"}}>⏳</div>
                          <div style={{color:X.t3,fontSize:13}}>Pipeline executing — experience renders on completion…</div>
                        </div>
                      ):claimed?(
                        <div className="fu" style={{background:X.card,border:`2px solid ${X.green}30`,borderRadius:16,padding:28,textAlign:"center",boxShadow:X.sh}}>
                          <div style={{fontSize:48,marginBottom:12}}>✅</div>
                          <div style={{fontWeight:900,fontSize:20,marginBottom:6,color:X.t1}}>
                            {uc.id==="churn"?"Offer Claimed Successfully":"Rebooking Confirmed"}
                          </div>
                          <div style={{fontSize:13,color:X.t2,marginBottom:18,lineHeight:1.6}}>
                            {uc.passenger.name} accepted the <strong style={{color:X.coral}}>{uc.offer.action}</strong>.
                          </div>
                          <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap",marginBottom:18}}>
                            {[uc.offer.action,uc.offer.miles,uc.offer.credit,uc.offer.lounge].map(t=>(
                              <div key={t} style={{background:X.surf,border:`1px solid ${X.bdr}`,borderRadius:10,padding:"8px 14px",fontSize:11,fontWeight:600,color:X.t1}}>{t}</div>
                            ))}
                          </div>
                          <div style={{padding:"12px 18px",background:X.greenB,border:"1px solid #A7F3D0",borderRadius:12,fontSize:12,color:X.greenD,fontWeight:600}}>
                            VoyagerAI: {uc.result.metric} recalculated <strong>{uc.result.before} → {uc.result.after}</strong> · Profile updated · Journey optimized
                          </div>
                        </div>
                      ):(
                        <div className="fu">
                          {/* Push mock */}
                          <div style={{background:X.card,border:`1px solid ${X.bdr}`,borderRadius:16,padding:16,marginBottom:12,boxShadow:X.sh}}>
                            <div style={{fontSize:9,fontWeight:800,color:X.t3,textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>📱 App Push — Omnichannel Activation Agent</div>
                            <div style={{background:X.surf,borderRadius:13,padding:14,border:`1px solid ${X.bdr}`}}>
                              <div style={{display:"flex",gap:10}}>
                                <div style={{width:38,height:38,borderRadius:10,background:X.coral,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:900,fontSize:14,flexShrink:0}}>✈</div>
                                <div>
                                  <div style={{fontWeight:700,fontSize:12,color:X.t1,marginBottom:2}}>Your Airline</div>
                                  <div style={{fontSize:11.5,color:X.t2,lineHeight:1.55}}>{uc.offer.headline}</div>
                                </div>
                              </div>
                            </div>
                          </div>
                          {/* Offer card */}
                          <div style={{background:X.card,border:`1px solid ${X.bdr}`,borderRadius:16,padding:18,boxShadow:X.shH}}>
                            <div style={{background:X.coralL,borderRadius:13,padding:22,marginBottom:16,border:`1px solid ${X.coralB}`}}>
                              <div style={{fontSize:9,fontWeight:800,color:X.coral,textTransform:"uppercase",letterSpacing:".1em",marginBottom:6}}>{uc.passenger.tier} Exclusive</div>
                              <div style={{fontWeight:900,fontSize:18,color:X.t1,lineHeight:1.3,marginBottom:4}}>{uc.offer.headline}</div>
                              <div style={{fontSize:12,color:X.t2}}>Action: <strong style={{color:X.coral}}>{uc.offer.action}</strong></div>
                            </div>
                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
                              {[["✈️","Action",uc.offer.action],["🎁","Miles",uc.offer.miles],["💳","Credit",uc.offer.credit],["🛋","Lounge",uc.offer.lounge]].map(([ic,lbl,val])=>(
                                <div key={lbl} style={{background:X.surf,borderRadius:11,padding:"10px 12px",border:`1px solid ${X.bdr}`}}>
                                  <div style={{fontSize:18,marginBottom:4}}>{ic}</div>
                                  <div style={{fontSize:8,color:X.t3,textTransform:"uppercase",fontWeight:800,letterSpacing:".05em",marginBottom:2}}>{lbl}</div>
                                  <div style={{fontSize:11,fontWeight:600,color:X.t1,lineHeight:1.4}}>{val}</div>
                                </div>
                              ))}
                            </div>
                            <div style={{background:X.amberB,border:"1px solid #FCD34D",borderRadius:10,padding:"9px 14px",marginBottom:14,fontSize:12,color:X.amberD,fontWeight:700,textAlign:"center"}}>⏰ Expires in 72 hours</div>
                            <button onClick={()=>setClaimed(true)} style={{width:"100%",padding:"13px 20px",borderRadius:11,border:"none",background:X.coral,color:X.tw,fontWeight:800,fontSize:14,boxShadow:`0 3px 12px ${X.coral}35`}}
                              onMouseEnter={e=>e.currentTarget.style.background=X.coralH}
                              onMouseLeave={e=>e.currentTarget.style.background=X.coral}
                            >{uc.id==="churn"?"Claim My Offer →":"Confirm Rebooking →"}</button>
                            <div style={{textAlign:"center",fontSize:9,color:X.t3,marginTop:10}}>Composed by AI Creative Agent · Personalized by 1:1 Agent · Activated via Omnichannel Agent</div>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* Data tab */}
                  {demoTab==="data"&&(
                    <div style={{background:X.card,border:`1px solid ${X.bdr}`,borderRadius:16,padding:20,boxShadow:X.sh}}>
                      <div style={{fontWeight:800,fontSize:14,marginBottom:18,color:X.t1}}>Pipeline Data Flow</div>
                      {uc.steps.map((step,i)=>(
                        <div key={i} style={{marginBottom:16,opacity:(stepStates[i]||"pending")==="done"?1:.15,transition:"opacity .4s"}}>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                            <div style={{width:18,height:18,borderRadius:6,background:PIPELINE[i].bg,border:`1px solid ${PIPELINE[i].color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:800,color:PIPELINE[i].color,fontFamily:mono}}>{i+1}</div>
                            <span style={{fontSize:12,fontWeight:700,color:X.t1}}>{PIPELINE[i].agent}</span>
                          </div>
                          <div style={{paddingLeft:26,fontSize:10.5,color:X.t2,lineHeight:1.5,marginBottom:8}}>
                            <div style={{marginBottom:3}}><span style={{fontWeight:700,color:X.t3}}>Data used → </span>{step.uses}</div>
                            <div><span style={{fontWeight:700,color:PIPELINE[i].color}}>Action → </span><span style={{color:X.t1,fontWeight:600}}>{step.action}</span></div>
                          </div>
                          <div style={{paddingLeft:26}}><DataBlock entries={step.d} color={PIPELINE[i].color}/></div>
                        </div>
                      ))}
                      {done===total&&(
                        <div className="fu" style={{marginTop:4,padding:16,background:X.coralL,border:`1px solid ${X.coralB}`,borderRadius:14}}>
                          <div style={{fontWeight:800,fontSize:10,color:X.coral,textTransform:"uppercase",letterSpacing:".06em",marginBottom:12}}>Differentiators Active</div>
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                            {KPIS.map(k=>(
                              <div key={k.label} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:X.card,borderRadius:10,border:`1px solid ${X.bdr}`}}>
                                <span style={{fontWeight:900,fontSize:16,color:k.color,fontFamily:mono,minWidth:40}}>{k.stat}</span>
                                <span style={{fontSize:10,color:X.t2,lineHeight:1.3}}>{k.label}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </section>

        {/* ═══ FOOTER ═══════════════════════════════════ */}
        <footer style={{textAlign:"center",padding:"28px 24px 32px",marginTop:24,fontSize:11,color:X.t3,borderTop:`1px solid ${X.bdr}`,background:X.card}}>
          <span style={{color:X.coral,fontWeight:800}}>x</span><span style={{fontWeight:700,color:X.t1}}>perion</span>
          <span style={{margin:"0 8px",color:X.bdr}}>·</span>VoyagerAI Industry Accelerator
          <span style={{margin:"0 8px",color:X.bdr}}>·</span>AI-Powered Engine for Airlines · Real-Time Personalisation at Scale
          <span style={{margin:"0 8px",color:X.bdr}}>·</span>© {new Date().getFullYear()} Coforge
        </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
